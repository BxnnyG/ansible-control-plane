# Throwaway stack for scripts/test-run-e2e.sh. Always started with a distinct
# project name (-p acp-e2e-<pid>): its own network and volumes, no published
# ports, images tagged acp-e2e-*:test. Never use it for anything else.
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: acp
      POSTGRES_DB: acp
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?}
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp"]
      interval: 2s
      timeout: 3s
      retries: 30

  gitsrv:
    # Serves the fixture repository over dumb HTTP (python http.server of the worker image).
    image: acp-e2e-worker:test
    entrypoint: ["python", "-m", "http.server", "8000", "--directory", "/srv"]
    volumes:
      - ${E2E_DIR:?}/git:/srv:ro
    mem_limit: 64m

  app:
    image: acp-e2e-app:test
    depends_on:
      postgres:
        condition: service_healthy
      gitsrv:
        condition: service_started
    environment:
      ACP_HTTP_ADDR: ":8080"
      ACP_WORKER_API_ADDR: ":8082"
      ACP_MASTER_KEY_FILE: /run/secrets/master_key
      ACP_WORKER_TOKEN_FILE: /run/secrets/worker_token
      ACP_DATA_DIR: /var/lib/acp
      ACP_DATABASE_URL: postgres://acp:${E2E_DB_PASSWORD}@postgres:5432/acp?sslmode=disable
      ACP_PUBLIC_URL: http://localhost:8080
    secrets: [master_key, worker_token]
    volumes:
      - acpdata:/var/lib/acp
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    image: acp-e2e-worker:test
    depends_on:
      app:
        condition: service_healthy
    environment:
      ACP_APP_URL: http://app:8082
      ACP_WORKER_ADDR: ":8081"
      ACP_WORKER_CACHE_DIR: /var/cache/acp
      ACP_WORKER_TOKEN_FILE: /run/secrets/worker_token
      ACP_WORKER_CONCURRENCY: "2"
      HOME: /home/acp
    secrets: [worker_token]
    read_only: true
    cap_drop: [ALL]
    # Only the capabilities the supervisor needs to start, signal and clean up jobs under
    # their own uids (file caps on the worker binary, ADR-0020); jobs get none.
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
      - /home/acp:size=64m,uid=10001,gid=10001,mode=0700
    volumes:
      - workercache:/var/cache/acp
    mem_limit: 512m
    pids_limit: 256

volumes:
  acpdata:
  workercache:

secrets:
  master_key:
    file: ${E2E_DIR}/secrets/master.key
  worker_token:
    file: ${E2E_DIR}/secrets/worker.token
