version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - gosec
    - misspell
    - unconvert
    - noctx
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
        text: "G101|G304"
formatters:
  enable:
    - gofmt
    - goimports
