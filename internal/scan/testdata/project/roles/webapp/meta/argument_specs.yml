argument_specs:
  main:
    short_description: Deploy the web app
    description:
      - Installs and configures the app.
      - Second line.
    options:
      app_port:
        type: int
        default: 8080
        description: Listen port
      app_env:
        type: str
        required: true
        choices: [dev, prod]
      app_ratio:
        type: float
      app_debug:
        type: bool
        default: false
      app_conf:
        type: path
      app_token:
        type: str
        no_log: true
        default: hunter2
      app_hosts:
        type: list
        elements: str
      app_db:
        type: dict
        options:
          host: {type: str, required: true}
          port: {type: int, default: 5432}
      app_users:
        type: list
        elements: dict
        options:
          name: {type: str, required: true}
      app_extra:
        type: raw
  upgrade:
    short_description: Upgrade
    options: {}
