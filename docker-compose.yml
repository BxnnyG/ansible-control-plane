name: acp

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: acp
      POSTGRES_DB: acp
      POSTGRES_PASSWORD: ${ACP_DB_PASSWORD:?set ACP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${ACP_VERSION:-dev}
        COMMIT: ${ACP_COMMIT:-unknown}
    image: acp-app:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACP_HTTP_ADDR: ":8080"
      ACP_WORKER_API_ADDR: ":8082"   # internal network only, never published
      ACP_RUN_LOG_RETENTION_DAYS: ${ACP_RUN_LOG_RETENTION_DAYS:-90}
      ACP_HTTPS_ADDR: ":8443"
      ACP_LOG_LEVEL: ${ACP_LOG_LEVEL:-info}
      ACP_MASTER_KEY_FILE: /run/secrets/master_key
      ACP_WORKER_TOKEN_FILE: /run/secrets/worker_token
      ACP_DATA_DIR: /var/lib/acp
      ACP_DATABASE_URL: postgres://acp:${ACP_DB_PASSWORD}@postgres:5432/acp?sslmode=disable
      ACP_PUBLIC_URL: ${ACP_PUBLIC_URL:-}
      ACP_ALLOW_INSECURE_HTTP: ${ACP_ALLOW_INSECURE_HTTP:-}
      ACP_METRICS_TOKEN: ${ACP_METRICS_TOKEN:-}
      ACP_OIDC_ISSUER: ${ACP_OIDC_ISSUER:-}
      ACP_OIDC_CLIENT_ID: ${ACP_OIDC_CLIENT_ID:-}
      ACP_OIDC_SCOPES: ${ACP_OIDC_SCOPES:-}
      ACP_OIDC_ROLES_CLAIM: ${ACP_OIDC_ROLES_CLAIM:-}
      ACP_SESSION_IDLE_TIMEOUT: ${ACP_SESSION_IDLE_TIMEOUT:-}
      ACP_SESSION_ABSOLUTE_TIMEOUT: ${ACP_SESSION_ABSOLUTE_TIMEOUT:-}
      ACP_TLS_CERT_FILE: ${ACP_TLS_CERT_FILE:-}
      ACP_TLS_KEY_FILE: ${ACP_TLS_KEY_FILE:-}
    secrets: [master_key, worker_token, tls_cert, tls_key]
    volumes:
      - acpdata:/var/lib/acp
    ports:
      - "${ACP_HTTP_PORT:-8080}:8080"
      - "${ACP_HTTPS_PORT:-8443}:8443"
    networks: [internal, default]
    mem_limit: 256m
    pids_limit: 512
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        VERSION: ${ACP_VERSION:-dev}
        COMMIT: ${ACP_COMMIT:-unknown}
    image: acp-worker:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ACP_APP_URL: http://app:8082
      ACP_WORKER_ADDR: ":8081"
      ACP_LOG_LEVEL: ${ACP_LOG_LEVEL:-info}
      ACP_WORKER_CACHE_DIR: /var/cache/acp
      ACP_WORKER_TOKEN_FILE: /run/secrets/worker_token
      ACP_WORKER_CONCURRENCY: ${ACP_WORKER_CONCURRENCY:-2}
      HOME: /home/acp
    secrets: [worker_token]
    read_only: true
    cap_drop: [ALL]
    # Only the capabilities the supervisor needs to start, signal and clean up jobs under
    # their own uids (file caps on the worker binary, ADR-0020); jobs get none.
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
      - /home/acp:size=64m,uid=10001,gid=10001,mode=0700
    volumes:
      - acpworker-cache:/var/cache/acp
    networks: [internal, egress]   # egress: only the worker may reach managed hosts
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  internal:
    internal: true
  egress: {}   # outbound access for the worker only (SSH to managed hosts)

volumes:
  pgdata:
  acpdata:
  acpworker-cache:

secrets:
  master_key:
    file: ./secrets/master.key
  worker_token:
    file: ./secrets/worker.token
  tls_cert:
    file: ${ACP_TLS_CERT_SECRET:-./deploy/empty}
  tls_key:
    file: ${ACP_TLS_KEY_SECRET:-./deploy/empty}
