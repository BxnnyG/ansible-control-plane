name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --config /repo/.gitleaks.toml

  go:
    name: Go (vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq git openssh-client
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./cmd/... ./internal/...

  web:
    name: Web (lint, check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f Dockerfile -t acp-app:ci .
      - run: docker build -f Dockerfile.worker -t acp-worker:ci .
