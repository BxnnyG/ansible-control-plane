        - {name: state, in: query, required: false, schema: {type: string, enum: [open, resolved]}}
        - {name: host_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: connector, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: include_untracked, in: query, required: false, schema: {type: boolean}, description: true also returns hosts whose only networks are untracked.}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FleetAlert'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/alerts/{id}/remediations:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [fleet]
      operationId: listAlertRemediations
      x-acp-permission: fleet.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RemediationRef'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/alerts/{id}/remediate:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [fleet]
      operationId: remediateAlert
      summary: Start the fix of an alert (a check run first when the rule asks for it)
      x-acp-permission: fleet.remediate
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RemediateInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RemediationResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/conflicts:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [fleet]
      operationId: listFleetConflicts
