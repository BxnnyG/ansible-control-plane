  /api/v1/workspaces/{workspace}/group-rules/{id}/apply:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [fleet]
      operationId: applyGroupRule
      description: Git inventories get a commit on their write branch (409 `git_conflict` when the branch moved).
      x-acp-permission: fleet.manage
      security: *mutating
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GroupRuleApplied'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/remediation-rules:
