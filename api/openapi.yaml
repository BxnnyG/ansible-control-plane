openapi: 3.1.0
info:
  title: Ansible Control Plane API
  version: 1.0.0
  description: |
    REST API of the app listener. Hand-maintained; `internal/server/openapi_test.go`
    fails when a registered route or its declared permission differs from this file.
    The frontend types are generated from it (`npm run gen:api` in `web/`).

    Every operation carries `x-acp-permission`: a policy permission (see
    `internal/policy`), `authenticated` (session only, acts on the caller's own
    data) or `public` (no session; hooks authenticate by signature or token).
    Workspace permissions answer 404 for non-members and 403 for missing rights.

    Mutating requests with a session need the CSRF token of the `acp_csrf`
    cookie in the `X-CSRF-Token` header. The worker API (internal listener) is
    not part of this document.
servers:
  - url: /
security:
  - sessionCookie: []
x-security-mutating: &mutating
  - sessionCookie: []
    csrfHeader: []
tags:
  - {name: auth}
  - {name: workspaces}
  - {name: secrets}
  - {name: projects}
  - {name: inventories}
  - {name: vault}
  - {name: templates}
  - {name: runs}
  - {name: schedules}
  - {name: connectors}
  - {name: fleet}
  - {name: notifications}
  - {name: hooks}
paths:
  /api/auth/config:
    get:
      tags: [auth]
      operationId: authConfig
      summary: Enabled login methods
      x-acp-permission: public
      security: []
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuthConfig'}}}}
  /api/auth/oidc/login:
    get:
      tags: [auth]
      operationId: oidcLogin
      summary: Start the OIDC login (browser redirect)
      x-acp-permission: public
      security: []
      parameters:
        - {name: return_to, in: query, required: false, schema: {type: string}, description: Local path to return to after login.}
      responses:
        '303': {description: Redirect to the identity provider, or to the login page with an error code.}
        '429': {$ref: '#/components/responses/Error'}
  /api/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: OIDC redirect target (browser redirect)
      x-acp-permission: public
      security: []
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
      responses:
        '303': {description: Redirect to the application, or to the login page with an error code.}
        '429': {$ref: '#/components/responses/Error'}
  /api/auth/breakglass/login:
    post:
      tags: [auth]
      operationId: breakGlassLogin
      summary: Break-glass admin login (password and TOTP)
      x-acp-permission: public
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BreakGlassCredentials'}}}}
      responses:
        '200': {description: Session cookies set, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      x-acp-permission: authenticated
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/LogoutResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      tags: [auth]
      operationId: me
      summary: The signed-in user and memberships
      x-acp-permission: authenticated
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/openapi.yaml:
    get:
      tags: [auth]
      operationId: openapiSpec
      summary: This OpenAPI document
      x-acp-permission: authenticated
      responses:
        '200': {description: OK, content: {application/yaml: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the caller is a member of
      x-acp-permission: authenticated
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WorkspaceSummary'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Workspace with the caller's role and permissions
      x-acp-permission: workspace.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceDetail'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/setup:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [workspaces]
      operationId: getSetup
      summary: First-run wizard status
      x-acp-permission: workspace.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SetupStatus'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [workspaces]
      operationId: setWorkspaceName
      summary: Rename the workspace
      x-acp-permission: workspace.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceNameInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SetupStatus'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/setup/complete:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    post:
      tags: [workspaces]
      operationId: completeSetup
      summary: Mark the first-run wizard as completed
      x-acp-permission: workspace.manage
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SetupStatus'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspace}/secrets:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: Secret metadata (values are never returned)
      x-acp-permission: secrets.meta.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SecretMeta'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [secrets]
      operationId: createSecret
      x-acp-permission: secrets.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecretCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/SecretMeta'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/secrets/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [secrets]
      operationId: getSecret
      x-acp-permission: secrets.meta.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SecretMeta'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [secrets]
      operationId: updateSecret
      x-acp-permission: secrets.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SecretUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SecretMeta'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [secrets]
      operationId: deleteSecret
      x-acp-permission: secrets.write
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspace}/vault-identities:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [vault]
      operationId: listVaultIdentities
      x-acp-permission: vault.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/VaultIdentity'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [vault]
      operationId: createVaultIdentity
      x-acp-permission: vault.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VaultIdentityInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/VaultIdentity'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/vault-identities/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [vault]
      operationId: getVaultIdentity
      x-acp-permission: vault.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VaultIdentity'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [vault]
      operationId: updateVaultIdentity
      x-acp-permission: vault.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VaultIdentityInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VaultIdentity'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [vault]
      operationId: deleteVaultIdentity
      x-acp-permission: vault.manage
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspace}/projects:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [projects]
      operationId: listProjects
      x-acp-permission: project.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Project'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [projects]
      operationId: createProject
      x-acp-permission: project.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [projects]
      operationId: getProject
      x-acp-permission: project.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [projects]
      operationId: updateProject
      summary: Partial update; omitted fields stay, null clears nullable fields
      x-acp-permission: project.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [projects]
      operationId: deleteProject
      x-acp-permission: project.write
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/hostkey/scan:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [projects]
      operationId: scanProjectHostKeys
      x-acp-permission: project.write
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/HostKeyScan'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/hostkey/confirm:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [projects]
      operationId: confirmProjectHostKey
      x-acp-permission: project.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HostKeyConfirmInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/test:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [projects]
      operationId: testProject
      summary: Probe the remote (read-only)
      x-acp-permission: project.sync
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OkResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/sync:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [projects]
      operationId: syncProject
      x-acp-permission: project.sync
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectRevision'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [projects]
      operationId: listProjectRevisions
      x-acp-permission: project.read
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectRevision'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/revisions/latest:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [projects]
      operationId: getLatestProjectRevision
      x-acp-permission: project.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectRevision'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/webhook:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [projects]
      operationId: getProjectWebhook
      x-acp-permission: project.write
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectWebhook'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [projects]
      operationId: setProjectWebhook
      summary: Enable or disable the webhook; the secret is returned once on enable
      x-acp-permission: project.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectWebhookInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectWebhook'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [projects]
      operationId: deleteProjectWebhook
      x-acp-permission: project.write
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/webhook/rotate:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [projects]
      operationId: rotateProjectWebhook
      x-acp-permission: project.write
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectWebhook'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/vault:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [vault]
      operationId: listProjectVault
      summary: Vault-encrypted files and inline values of the latest revision
      x-acp-permission: vault.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VaultListing'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/vault/decrypt:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [vault]
      operationId: decryptProjectVault
      x-acp-permission: vault.decrypt
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VaultDecryptInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VaultDecrypted'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/vault/encrypt:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [vault]
      operationId: encryptProjectVault
      x-acp-permission: vault.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VaultEncryptInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VaultWriteResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/projects/{id}/vault/rekey:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [vault]
      operationId: rekeyProjectVault
      x-acp-permission: vault.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VaultRekeyInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VaultWriteResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspace}/inventories:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [inventories]
      operationId: listInventories
      x-acp-permission: inventory.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Inventory'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [inventories]
      operationId: createInventory
      x-acp-permission: inventory.write
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Inventory'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [inventories]
      operationId: getInventory
      x-acp-permission: inventory.read
      responses:
        '200': {description: OK, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Inventory'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [inventories]
      operationId: updateInventory
      description: Optimistic locking through `If-Match` (409 `version_conflict` on a stale version).
      x-acp-permission: inventory.write
      security: *mutating
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Inventory'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [inventories]
      operationId: deleteInventory
      x-acp-permission: inventory.write
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}/import:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [inventories]
      operationId: importInventory
      x-acp-permission: inventory.write
      security: *mutating
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryImportInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryImportResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}/render:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [inventories]
      operationId: renderInventory
      summary: '`ansible-inventory --list` shape; vault values masked unless exported'
      x-acp-permission: inventory.read
      parameters:
        - {name: export, in: query, required: false, schema: {type: boolean}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryRender'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}/diff:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [inventories]
      operationId: diffInventory
      x-acp-permission: inventory.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryDiff'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}/commit:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [inventories]
      operationId: commitInventory
      x-acp-permission: inventory.write
      security: *mutating
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryCommitInput'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryCommitResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}/groups:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [inventories]
      operationId: listInventoryGroups
      x-acp-permission: inventory.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InventoryGroup'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [inventories]
      operationId: createInventoryGroup
      x-acp-permission: inventory.write
      security: *mutating
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryGroupInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryGroup'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/inventories/{id}/groups/{gid}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/Gid'}]
    get:
      tags: [inventories]
