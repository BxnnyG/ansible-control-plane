        default: {$ref: '#/components/responses/Error'}

  /api/hooks/projects/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [hooks]
      operationId: projectWebhook
      summary: Git provider push webhook (signature authenticated)
      description: Unknown project, disabled hook and bad signature are indistinguishable (404). Rate limited per source address.
      x-acp-permission: public
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        '202': {description: Accepted or ignored, content: {application/json: {schema: {$ref: '#/components/schemas/HookStatus'}}}}
        '404': {description: Not found or rejected.}
        '413': {description: Request too large.}
        '429': {description: Rate limited.}
  /api/hooks/templates/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [hooks]
      operationId: templateWebhook
      summary: Start a template run (signature authenticated)
      x-acp-permission: public
      security: []
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateHookResult'}}}}
        '404': {description: Not found or rejected.}
        '413': {description: Request too large.}
        '429': {description: Rate limited.}
        default: {$ref: '#/components/responses/Error'}
  /api/hooks/alerts/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [hooks]
      operationId: alertWebhook
      summary: Alert receiver of an alert_webhook connector (bearer token authenticated)
      description: Accepts a generic alert list or an Alertmanager payload.
      x-acp-permission: public
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AlertHookResult'}}}}
        '404': {description: Not found or rejected.}
        '413': {description: Request too large.}
        '429': {description: Rate limited.}
        default: {$ref: '#/components/responses/Error'}

  /api/v1/workspaces/{workspace}/notifications/channels:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      x-acp-permission: notification.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NotificationChannel'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      x-acp-permission: notification.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannelInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannel'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/notifications/channels/test:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    post:
      tags: [notifications]
      operationId: testNotificationChannelDraft
      summary: Send a test message through an unsaved channel definition.
      description: >-
        The config is validated like on create. `secret_value` is used only in memory and is never
        stored, logged, audited or returned. Without any secret and with `channel_id`, the stored
        secret of that channel is used. Rate limited per user.
      x-acp-permission: notification.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannelDraft'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTestResult'}}}}
        '429': {description: Rate limited.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/notifications/channels/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [notifications]
      operationId: getNotificationChannel
      x-acp-permission: notification.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannel'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [notifications]
      operationId: updateNotificationChannel
      x-acp-permission: notification.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannelPatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannel'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      x-acp-permission: notification.manage
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/notifications/channels/{id}/test:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      x-acp-permission: notification.manage
      security: *mutating
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTestResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/notifications/rules:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [notifications]
      operationId: listNotificationRules
      x-acp-permission: notification.read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NotificationRule'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [notifications]
      operationId: createNotificationRule
      x-acp-permission: notification.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRuleInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRule'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/notifications/rules/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    patch:
      tags: [notifications]
      operationId: updateNotificationRule
      x-acp-permission: notification.manage
      security: *mutating
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRulePatch'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationRule'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [notifications]
      operationId: deleteNotificationRule
      x-acp-permission: notification.manage
      security: *mutating
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/notifications/deliveries:
    parameters: [{$ref: '#/components/parameters/Workspace'}]
    get:
      tags: [notifications]
      operationId: listNotificationDeliveries
      x-acp-permission: notification.read
      parameters:
        - {name: channel_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, sent, failed]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NotificationDelivery'}}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: acp_session
      description: Session cookie (`__Host-acp_session` over HTTPS).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Value of the `acp_csrf` cookie (`__Host-acp_csrf` over HTTPS); required on non-GET requests.
  parameters:
    Workspace: {name: workspace, in: path, required: true, schema: {type: string}, description: Workspace slug.}
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Gid: {name: gid, in: path, required: true, schema: {type: string, format: uuid}}
    Hid: {name: hid, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: {type: string}
      description: Quoted inventory version (`"7"`); 409 `version_conflict` when stale.
  headers:
    ETag: {description: Quoted inventory version., schema: {type: string}}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorBody'}}}
    NoContent: {description: No content}
  schemas:
    ErrorBody:
      type: object
      description: Error envelope. `code` is a stable machine-readable value (open set, e.g. not_found, conflict, invalid, bad_request, version_conflict, git_conflict).
      required: [error]
      properties:
        error: {type: string}
        code: {type: string}
        detail: {type: string}
        paths: {type: array, items: {type: string}, description: Conflicting paths of a git_conflict error.}
    StatusResponse:
      type: object
      required: [status]
      properties:
        status: {type: string}
    OkResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    LogoutResult:
      type: object
      required: [redirect]
      properties:
        redirect: {type: string}
    HookStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [accepted, ignored]}
    TemplateHookResult:
      type: object
      required: [status, run_id]
      properties:
        status: {type: string}
        run_id: {type: string, format: uuid}
    AlertHookResult:
      type: object
      required: [status, alerts]
      properties:
        status: {type: string}
        alerts: {type: integer}
    AuthConfig:
      type: object
      required: [oidc, breakglass]
      properties:
        oidc: {type: boolean}
        breakglass: {type: boolean}
    BreakGlassCredentials:
      type: object
      required: [username, password, totp]
      properties:
        username: {type: string}
        password: {type: string}
        totp: {type: string}
    Membership:
      type: object
      required: [workspace_id, slug, name, role, scoped]
      properties:
        workspace_id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        role: {type: string}
        scoped: {type: boolean}
    Me:
      type: object
      required: [id, email, display_name, memberships]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        memberships: {type: array, items: {$ref: '#/components/schemas/Membership'}}
    WorkspaceSummary:
      type: object
      required: [slug, name, role, scoped]
      properties:
        slug: {type: string}
        name: {type: string}
        role: {type: string}
        scoped: {type: boolean}
    WorkspaceDetail:
      type: object
      required: [slug, name, description, role, scoped, permissions]
      properties:
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        role: {type: string}
        scoped: {type: boolean}
        permissions: {type: array, items: {type: string}}
    WorkspaceNameInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
    RoleMapping:
      type: object
      required: [idp_role, role]
      properties:
        idp_role: {type: string}
        role: {type: string}
    SetupStatus:
      type: object
      required: [name, completed, completed_at, auth]
      properties:
        name: {type: string}
        completed: {type: boolean}
        completed_at: {type: [string, 'null'], format: date-time}
        auth:
          type: object
          required: [oidc, issuer_host, role_mappings, breakglass]
          properties:
            oidc: {type: boolean}
            issuer_host: {type: string}
            role_mappings: {type: array, items: {$ref: '#/components/schemas/RoleMapping'}}
            breakglass: {type: boolean}

    SecretType:
      type: string
      enum: [ssh_key, password, token, vault_password, file, api_key_pair, api_token]
    SecretMeta:
      type: object
      description: Non-secret view of a stored secret; values are write-only and never returned.
      required: [id, name, type, description, metadata, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {$ref: '#/components/schemas/SecretType'}
        description: {type: string}
        metadata: {type: object, additionalProperties: true, description: 'e.g. fingerprint and key_type for ssh_key.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SecretCreate:
      type: object
      required: [name, type, value]
      properties:
        name: {type: string}
        type: {$ref: '#/components/schemas/SecretType'}
        description: {type: string}
        value: {type: string, writeOnly: true}
    SecretUpdate:
      type: object
      description: Omitted fields stay untouched; `value` replaces the stored secret.
      properties:
        name: {type: string}
        description: {type: string}
        value: {type: string, writeOnly: true}

    ProjectSyncStatus: {type: string, enum: [never, ok, error]}
    Project:
      type: object
      description: A Git project; credentials are referenced by secret id and never returned.
      required: [id, name, slug, url, default_ref, credential_secret_id, https_username, ssh, host_key_pinned, host_key_fingerprints, sync_interval_seconds, last_sync_status, last_sync_error, last_sync_sha, last_sync_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        url: {type: string}
        default_ref: {type: string}
        credential_secret_id: {type: [string, 'null'], format: uuid}
        https_username: {type: string}
        ssh: {type: boolean}
        host_key_pinned: {type: boolean}
        host_key_fingerprints: {type: array, items: {type: string}}
        sync_interval_seconds: {type: [integer, 'null']}
        last_sync_status: {$ref: '#/components/schemas/ProjectSyncStatus'}
        last_sync_error: {type: string}
        last_sync_sha: {type: string}
        last_sync_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
