        config: {$ref: '#/components/schemas/ConnectorConfig'}
        secret_id: {type: [string, 'null'], format: uuid}
        interval_seconds: {type: integer}
        enabled: {type: boolean}
    ConnectorTestInput:
      type: object
      description: Unsaved configuration to probe (setup wizard "test before save").
      required: [type]
      properties:
        type: {type: string}
        base_url: {type: string}
        config: {$ref: '#/components/schemas/ConnectorConfig'}
        secret_id: {type: [string, 'null'], format: uuid}
    ConnectorTestResult:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean}
        error: {type: string}
    ConnectorSync:
      type: object
      required: [id, trigger, status, started_at, finished_at, duration_ms, counts, error]
      properties:
        id: {type: string, format: uuid}
        trigger: {type: string, enum: [schedule, manual]}
        status: {type: string, enum: [ok, error]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        counts: {$ref: '#/components/schemas/ConnectorCounts'}
        error: {type: string}

    AlertSeverity: {type: string, enum: [critical, warning, unknown, info]}
    FleetNetworkCounts:
      type: object
      required: [online, ansible_ok, failed, never_managed, open_alerts]
      properties:
        online: {type: integer}
        ansible_ok: {type: integer}
        failed: {type: integer}
        never_managed: {type: integer}
        open_alerts: {type: integer}
    FleetNetwork:
      type: object
      required: [id, connector_id, connector, external_key, cidr, vlan, interface, description, source, tracked, first_seen, last_seen, host_count, counts]
      properties:
        id: {type: string, format: uuid}
        connector_id: {type: string, format: uuid}
        connector: {type: string}
        external_key: {type: string}
        cidr: {type: string}
        vlan: {type: [integer, 'null']}
        interface: {type: string}
        description: {type: string}
        source: {type: string}
        tracked: {type: boolean, description: Untracked networks are hidden from host lists, counts and alerts unless include_untracked=true.}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        host_count: {type: integer}
        counts: {$ref: '#/components/schemas/FleetNetworkCounts', description: Status counters of the visible hosts in the network.}
    FleetNetworkTrackInput:
      type: object
      required: [tracked]
      properties:
        tracked: {type: boolean}
    FleetNetworksTrackInput:
      type: object
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
        tracked: {type: boolean}
        track_only: {type: array, items: {type: string, format: uuid}, description: Track exactly these networks, untrack the rest.}
    FleetTrackResult:
      type: object
      required: [updated]
      properties:
        updated: {type: integer}
    FleetSettings:
      type: object
      required: [new_networks_tracked]
      properties:
        new_networks_tracked: {type: boolean, description: Whether newly discovered networks start tracked.}
    FleetAnsibleLink:
      type: object
      description: An inventory host linked to a fleet host.
      required: [inventory_id, inventory, host_id, host]
      properties:
        inventory_id: {type: string, format: uuid}
        inventory: {type: string}
        host_id: {type: string, format: uuid}
        host: {type: string}
    FleetRunRef:
      type: object
      required: [run_id, template, finished_at, result, check]
      properties:
        run_id: {type: string, format: uuid}
        template: {type: string}
        finished_at: {type: string, format: date-time}
        result: {type: string, enum: [ok, changed, failed, unreachable]}
        check: {type: boolean}
    FleetDrift:
      type: object
      description: The newest check-mode run reported changes for the host.
      required: [run_id, template, finished_at, changed]
      properties:
        run_id: {type: string, format: uuid}
        template: {type: string}
        finished_at: {type: string, format: date-time}
        changed: {type: integer}
    FleetHost:
      type: object
      required: [id, name, kind, status, hostname, fqdn, ips, macs, tags, connectors, open_conflicts, open_alerts, worst_severity, first_seen, last_seen, online, managed, ansible, last_run, reachable, drift]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string}
        status: {type: string}
        hostname: {type: string}
        fqdn: {type: string}
        ips: {type: array, items: {type: string}}
        macs: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        attrs: {type: object, additionalProperties: {type: string}, description: Connector-specific attributes.}
        connectors: {type: array, items: {type: string}, description: Names of the connectors that contributed.}
        open_conflicts: {type: integer}
        open_alerts: {type: integer, description: Open monitoring alerts linked to the host.}
        worst_severity: {type: string, enum: [critical, warning, unknown, info, ''], description: Worst severity among the open alerts; empty when none.}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        online: {type: string, enum: [online, offline, unknown], description: Host status, derived on read.}
        managed: {type: boolean, description: True when an inventory host of the workspace is linked.}
        ansible: {type: array, items: {$ref: '#/components/schemas/FleetAnsibleLink'}}
        last_run: {oneOf: [{$ref: '#/components/schemas/FleetRunRef'}, {type: 'null'}]}
        reachable: {type: string, enum: ['yes', 'no', unknown]}
        drift: {oneOf: [{$ref: '#/components/schemas/FleetDrift'}, {type: 'null'}]}
    FleetSource:
      type: object
      required: [connector_id, connector, type]
      properties:
        connector_id: {type: string, format: uuid}
        connector: {type: string}
        type: {type: string}
    FleetHostFields:
      type: object
      properties:
        kind: {type: string}
        hostname: {type: string}
        fqdn: {type: string}
        macs: {type: array, items: {type: string}}
        ips: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        notes: {type: string}
        status: {type: string}
        interface: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        net_seen: {type: string, format: date-time}
        power: {type: string}
        sources:
          type: object
          description: Per field, the winning connector (scalars) or all contributors (lists).
          additionalProperties: {type: array, items: {$ref: '#/components/schemas/FleetSource'}}
    FleetObservation:
      type: object
      required: [connector_id, connector, connector_type, external_key, kind, fields, first_seen, last_seen]
      properties:
        connector_id: {type: string, format: uuid}
        connector: {type: string}
        connector_type: {type: string}
        external_key: {type: string}
        kind: {type: string}
        fields:
          type: object
          properties:
            macs: {type: array, items: {type: string}}
            hostname: {type: string}
            fqdn: {type: string}
            ips: {type: array, items: {type: string}}
            tags: {type: array, items: {type: string}}
            notes: {type: string}
            status: {type: string}
            interface: {type: string}
            attrs: {type: object, additionalProperties: {type: string}}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
    ConflictState: {type: string, enum: [open, acknowledged, resolved]}
    FleetConflict:
      type: object
      required: [id, type, state, fingerprint, host_ids, hosts, details, acknowledged_by, acknowledged_at, first_seen, last_seen, resolved_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        state: {$ref: '#/components/schemas/ConflictState'}
        fingerprint: {type: string}
        host_ids: {type: array, items: {type: string, format: uuid}}
        hosts:
          type: array
          description: Display names of the hosts visible to the caller.
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
        details: {type: [object, 'null'], additionalProperties: true}
        acknowledged_by: {type: [string, 'null'], format: uuid}
        acknowledged_at: {type: [string, 'null'], format: date-time}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
    FleetHostDetail:
      allOf:
        - $ref: '#/components/schemas/FleetHost'
        - type: object
          required: [fields, keys, observations, conflicts]
          properties:
            fields: {$ref: '#/components/schemas/FleetHostFields'}
            keys:
              type: array
              items:
                type: object
                required: [kind, value]
                properties:
                  kind: {type: string, enum: [mac, name, ip]}
                  value: {type: string}
            observations: {type: array, items: {$ref: '#/components/schemas/FleetObservation'}}
            conflicts: {type: array, items: {$ref: '#/components/schemas/FleetConflict'}}
    FleetAddInput:
      type: object
      required: [inventory_id, group]
      properties:
        inventory_id: {type: string, format: uuid}
        group: {type: string}
        name: {type: string, description: Inventory host name; defaults to the fleet host name.}
    GroupChangeResult:
      type: object
      required: [group_created, hosts_created, added, removed, version, commit]
      properties:
        group_created: {type: boolean}
        hosts_created: {type: [array, 'null'], items: {type: string}}
        added: {type: [array, 'null'], items: {type: string}}
        removed: {type: [array, 'null'], items: {type: string}}
        version: {type: integer}
        commit: {oneOf: [{$ref: '#/components/schemas/InventoryCommitResult'}, {type: 'null'}], description: Set for git inventories when a commit was written.}
    FleetAddResult:
      type: object
      required: [host, ansible_host, result]
      properties:
        host: {type: string}
        ansible_host: {type: string}
        result: {$ref: '#/components/schemas/GroupChangeResult'}
    FleetAlert:
      type: object
      required: [id, connector_id, connector, connector_type, external_key, host_id, host, host_name, host_ip, service, severity, summary, labels, started_at, last_seen_at, resolved_at]
      properties:
        id: {type: string, format: uuid}
        connector_id: {type: string, format: uuid}
        connector: {type: string}
        connector_type: {type: string}
        external_key: {type: string}
        host_id: {type: [string, 'null'], format: uuid}
        host: {type: string, description: Merged host name when linked.}
        host_name: {type: string, description: Host name as reported by the monitoring system.}
        host_ip: {type: string, description: Address as reported by the monitoring system.}
        service: {type: string}
        severity: {$ref: '#/components/schemas/AlertSeverity'}
        summary: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        started_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}

    GroupRuleKind:
      type: string
      description: Match kind of a group rule; the set is open (e.g. subnet, proxmox_tag, netbox_role, netbox_site, netbox_tag).
    GroupRuleMode: {type: string, enum: [add-only, sync]}
    GroupRule:
      type: object
      required: [id, name, kind, params, inventory_id, group, mode, enabled, last_applied_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/GroupRuleKind'}
        params: {type: object, additionalProperties: true, description: 'Kind specific parameters: cidr for subnet, tag for proxmox_tag.'}
        inventory_id: {type: string, format: uuid}
        group: {type: string}
        mode: {$ref: '#/components/schemas/GroupRuleMode'}
        enabled: {type: boolean}
        last_applied_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    GroupRuleInput:
      type: object
      required: [name, kind, params, inventory_id, group]
      properties:
        name: {type: string}
        kind: {$ref: '#/components/schemas/GroupRuleKind'}
        params: {type: object, additionalProperties: true}
        inventory_id: {type: string, format: uuid}
        group: {type: string}
        mode: {$ref: '#/components/schemas/GroupRuleMode'}
        enabled: {type: boolean}
    GroupRuleUpdate:
      type: object
      properties:
        name: {type: string}
        kind: {$ref: '#/components/schemas/GroupRuleKind'}
        params: {type: object, additionalProperties: true}
        inventory_id: {type: string, format: uuid}
        group: {type: string}
        mode: {$ref: '#/components/schemas/GroupRuleMode'}
        enabled: {type: boolean}
    GroupRuleAdd:
      type: object
      required: [name, create_host, fleet_host_id]
      properties:
        name: {type: string}
        ansible_host: {type: string, description: Only set for hosts that are created.}
        create_host: {type: boolean}
        fleet_host_id: {type: string, format: uuid}
    GroupRuleSkipped:
      type: object
      required: [fleet_host_id, name, reason]
      properties:
        fleet_host_id: {type: string, format: uuid}
        name: {type: string}
        reason: {type: string}
    GroupRulePlan:
      type: object
      description: The pure diff of a rule against the current inventory state.
      required: [group_create, matched, add, remove, keep, untrack, skipped]
      properties:
        group_create: {type: boolean}
        matched: {type: integer}
        add: {type: array, items: {$ref: '#/components/schemas/GroupRuleAdd'}}
        remove: {type: array, items: {type: string}}
        keep: {type: integer}
        untrack: {type: array, items: {type: string}}
        skipped: {type: array, items: {$ref: '#/components/schemas/GroupRuleSkipped'}}
    GroupRulePreview:
      type: object
      required: [rule, inventory_mode, plan]
      properties:
        rule: {$ref: '#/components/schemas/GroupRule'}
        inventory_mode: {$ref: '#/components/schemas/InventoryMode'}
        plan: {$ref: '#/components/schemas/GroupRulePlan'}
    GroupRuleApplied:
      type: object
      required: [rule, inventory_mode, plan, result]
      properties:
        rule: {$ref: '#/components/schemas/GroupRule'}
        inventory_mode: {$ref: '#/components/schemas/InventoryMode'}
        plan: {$ref: '#/components/schemas/GroupRulePlan'}
        result: {$ref: '#/components/schemas/GroupChangeResult'}

    RemediationTarget: {type: string, enum: [host, group, network]}
    RemediationRule:
      type: object
      required: [id, name, enabled, connector_type, service_regex, summary_regex, min_severity, template_id, template, target, group, check_first, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        connector_type: {type: [string, 'null'], description: Null matches alerts of every connector type.}
        service_regex: {type: string}
        summary_regex: {type: string}
        min_severity: {$ref: '#/components/schemas/AlertSeverity'}
        template_id: {type: string, format: uuid}
        template: {type: string}
        target: {$ref: '#/components/schemas/RemediationTarget'}
        group: {type: string}
        check_first: {type: boolean}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RemediationRuleInput:
      type: object
      required: [name, connector_type, service_regex, summary_regex, min_severity, template_id, target, group, check_first]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        connector_type: {type: [string, 'null']}
        service_regex: {type: string}
        summary_regex: {type: string}
        min_severity: {$ref: '#/components/schemas/AlertSeverity'}
        template_id: {type: string, format: uuid}
        target: {$ref: '#/components/schemas/RemediationTarget'}
        group: {type: string}
        check_first: {type: boolean}
    RemediationRulePreviewInput:
      type: object
      required: [connector_type, service_regex, summary_regex, min_severity]
      properties:
        connector_type: {type: [string, 'null']}
        service_regex: {type: string}
        summary_regex: {type: string}
        min_severity: {$ref: '#/components/schemas/AlertSeverity'}
    RemediationRef:
      type: object
      description: A rule that can fix a given alert.
      required: [rule_id, name, template, target, group, check_first]
      properties:
        rule_id: {type: string, format: uuid}
        name: {type: string}
        template: {type: string}
        target: {$ref: '#/components/schemas/RemediationTarget'}
        group: {type: string}
        check_first: {type: boolean}
    RemediateInput:
      type: object
      required: [rule_id]
      properties:
        rule_id: {type: string, format: uuid}
        skip_check: {type: boolean}
    RemediationResult:
      type: object
      required: [run, limit, hosts]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        phase: {type: string, enum: [check, apply]}
        limit: {type: string}
        hosts: {type: array, items: {type: string}}
    BulkRunInput:
      type: object
      required: [host_ids, template_id]
      properties:
        host_ids: {type: array, items: {type: string, format: uuid}}
        template_id: {type: string, format: uuid}
        check_mode: {type: boolean}
    BulkRunSkipped:
      type: object
      required: [host_id, name, reason]
      properties:
        host_id: {type: string, format: uuid}
        name: {type: string}
        reason: {type: string}
    BulkRunResult:
      type: object
      required: [run, limit, hosts]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        limit: {type: string}
        hosts: {type: array, items: {type: string}}
        skipped: {type: array, items: {$ref: '#/components/schemas/BulkRunSkipped'}}
    NotificationChannel:
      type: object
      description: Notification channel. Credentials are never returned, only the id of the referenced secret.
      required: [id, name, type, config, secret_id, tls_ca_pem, tls_skip_verify, enabled, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [webhook, matrix, smtp, gotify, ntfy]}
        config: {type: object, additionalProperties: true, description: Type specific, non-secret settings.}
        secret_id: {type: [string, 'null'], format: uuid}
        tls_ca_pem: {type: string}
        tls_skip_verify: {type: boolean}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationChannelInput:
      type: object
      required: [name, type]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        type: {type: string, enum: [webhook, matrix, smtp, gotify, ntfy]}
        config: {type: object, additionalProperties: true}
        secret_id: {type: [string, 'null'], format: uuid}
        tls_ca_pem: {type: string}
        tls_skip_verify: {type: boolean}
        enabled: {type: boolean, default: true}
    NotificationChannelPatch:
      type: object
      description: Partial update; `config` replaces the whole config, `secret_id` null removes the credential. The type is immutable.
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        config: {type: object, additionalProperties: true}
        secret_id: {type: [string, 'null'], format: uuid}
        tls_ca_pem: {type: string}
        tls_skip_verify: {type: boolean}
        enabled: {type: boolean}
    NotificationChannelDraft:
      type: object
      required: [type, config]
      properties:
        type: {type: string, enum: [webhook, matrix, smtp, gotify, ntfy]}
        config: {type: object, additionalProperties: true}
        secret_id: {type: [string, 'null'], format: uuid}
        secret_value: {type: string, writeOnly: true, description: Unsaved credential; used in memory only.}
        tls_ca_pem: {type: string}
        tls_skip_verify: {type: boolean}
        channel_id: {type: [string, 'null'], format: uuid, description: Existing channel whose stored secret is used when no secret is given.}
    NotificationTestResult:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean}
        error: {type: string, description: Sanitized error text of a failed send.}
    NotificationRule:
      type: object
      required: [id, channel_id, events, template_id, enabled, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        events: {type: array, items: {type: string, enum: [run.failed, run.recovered, run.drift, run.finished]}}
        template_id: {type: [string, 'null'], format: uuid, description: Restrict the rule to one template; null matches all.}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationRuleInput:
      type: object
      required: [channel_id, events]
      properties:
        channel_id: {type: string, format: uuid}
        events: {type: array, minItems: 1, items: {type: string, enum: [run.failed, run.recovered, run.drift, run.finished]}}
        template_id: {type: [string, 'null'], format: uuid}
        enabled: {type: boolean, default: true}
    NotificationRulePatch:
      type: object
      properties:
        channel_id: {type: string, format: uuid}
        events: {type: array, minItems: 1, items: {type: string, enum: [run.failed, run.recovered, run.drift, run.finished]}}
        template_id: {type: [string, 'null'], format: uuid}
        enabled: {type: boolean}
    NotificationDelivery:
      type: object
      required: [id, channel_id, run_id, kind, status, attempts, next_attempt_at, last_error, sent_at, created_at]
      properties:
        id: {type: string, format: uuid}
        channel_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        kind: {type: string}
        status: {type: string, enum: [pending, sent, failed]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string}
        sent_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
