        '200': {description: OK, content: {application/json: {schema: {type: object, additionalProperties: {type: array, items: {$ref: '#/components/schemas/RemediationRef'}}}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/workspaces/{workspace}/remediation-rules/{id}:
    parameters: [{$ref: '#/components/parameters/Workspace'}, {$ref: '#/components/parameters/Id'}]
    get:
      tags: [fleet]
      operationId: getRemediationRule
